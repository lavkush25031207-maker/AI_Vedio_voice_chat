services:
  - type: web
    name: talkflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthy-dishes-db
          property: connectionString
      - key: APP_PUBLIC_URL
        value: https://talkflow-frontend.onrender.com
