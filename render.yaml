services:
  - type: web
    name: talkflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talkflow-db
          property: connectionString
      - key: APP_PUBLIC_URL
        value: https://talkflow-frontend.onrender.com

  - type: static_site
    name: talkflow-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://talkflow-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: talkflow-db
    databaseName: talkflow
    user: talkflow
    plan: free
